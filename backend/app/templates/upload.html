<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Evony All-Star Analyzer - Upload</title>
    <link href="/static/bootstrap.min.css" rel="stylesheet">
    <style>
      body { padding-top: 2rem; }
      .upload-card { max-width: 720px; margin: 0 auto; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card upload-card">
        <div class="card-body">
          <h5 class="card-title">Evony All-Star Analyzer</h5>
          <p class="card-text">Upload screenshots (Alliance rankings or Player lists). You can upload many images at once; processing will run in the background.</p>
          <form id="upload-form" action="/upload" method="post" enctype="multipart/form-data">
            <div class="mb-3">
              <label for="screenshot_type" class="form-label">Screenshot Type</label>
              <select class="form-select" id="screenshot_type" name="screenshot_type" required>
                <option value="type1">Type 1 - Alliance Ranking</option>
                <option value="type2">Type 2 - Player List</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="alliance_id" class="form-label">Alliance (for Type 2)</label>
              <select class="form-select" id="alliance_id" name="alliance_id">
                <option value="">-- Select alliance --</option>
                <!-- Placeholder: populated later -->
              </select>
            </div>
            <div class="mb-3">
              <label for="files" class="form-label">Select screenshots</label>
              <input class="form-control" type="file" id="files" name="files" multiple accept="image/png,image/jpeg,image/heic">
            </div>
            <button type="submit" class="btn btn-primary">Upload</button>
          </form>
          <div id="result" class="mt-3"></div>
        </div>
      </div>
    </div>

    <script src="/static/bootstrap.bundle.min.js"></script>
    <script>
    document.getElementById('upload-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const form = e.target;
      const data = new FormData(form);
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = 'Uploading...';
      try {
        const resp = await fetch(form.action, { method: 'POST', body: data });
        const json = await resp.json();
        resultDiv.innerHTML = `<div class="alert alert-success">Uploaded ${json.uploaded} files. Screenshot IDs: ${json.screenshot_ids.join(', ')}</div>`;
      } catch (err) {
        console.error(err);
        resultDiv.innerHTML = `<div class="alert alert-danger">Upload failed.</div>`;
      }
    });
    </script>
  </body>
</html>
